name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          # The lowest Node version in package.json engines.
          - os: ubuntu-latest
            node: "20.19"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install
      - run: vp check
      - run: vp test
      - run: vp pack
      - name: Smoke test the CLI
        run: |
          node dist/cli.mjs --version
          node dist/cli.mjs build playground --out _site
          node -e "const fs = require('node:fs'); for (const f of ['_site/index.html', '_site/showcase.html', '_site/_comarkserv/search.json']) if (!fs.existsSync(f)) { console.error('missing ' + f); process.exit(1) }"
